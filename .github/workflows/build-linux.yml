name: Build Linux (AppImage + deb)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build Linux artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libportaudio2 portaudio19-dev ydotool \
            libfuse2 desktop-file-utils
          python -m pip install --upgrade pip

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: bash installers/linux/build-deb.sh "${{ steps.version.outputs.VERSION }}"

      - name: Build AppImage
        run: bash installers/linux/build-appimage.sh "${{ steps.version.outputs.VERSION }}"
        env:
          VOXD_SKIP_DEPS: "1"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxd-linux
          path: |
            build/*.deb
            build/*.AppImage
