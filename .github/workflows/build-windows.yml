name: Build Windows (exe + installer)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean installers/windows/voxd.spec

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: cmd
        env:
          VOXD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if exist "%ISCC%" (
            "%ISCC%" /DMyAppVersion=%VOXD_VERSION% installers\windows\voxd.iss
          ) else (
            where iscc
            iscc /DMyAppVersion=%VOXD_VERSION% installers\windows\voxd.iss
          )

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\VOXD -DestinationPath "build\windows\VOXD-${{ steps.version.outputs.VERSION }}-portable.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxd-windows
          path: |
            build/windows/*-Setup.exe
            build/windows/*-portable.zip
