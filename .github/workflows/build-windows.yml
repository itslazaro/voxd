name: Build Windows (exe + installer)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean installers/windows/voxd.spec

      - name: Build first-run setup tool
        run: pyinstaller --noconfirm --clean installers/windows/voxd-setup.spec

      - name: Bundle setup tool into the app folder
        shell: pwsh
        run: |
          if (Test-Path dist\VOXD-setup.exe) {
            Copy-Item dist\VOXD-setup.exe dist\VOXD\VOXD-setup.exe -Force
          }

      - name: Code sign binaries (optional)
        if: ${{ vars.ENABLE_CODE_SIGNING == 'true' }}
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:TEMP "voxd_cert.pfx"
          [System.Convert]::FromBase64String($env:CERT_PFX_BASE64) | Set-Content -Path $pfx -AsByteStream
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if (-not $signtool) { Write-Error "signtool.exe not found in Windows SDK"; exit 1 }
          $targets = @("dist\VOXD\VOXD.exe", "dist\VOXD\VOXD-setup.exe") | Where-Object { Test-Path $_ }
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $targets

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: cmd
        env:
          VOXD_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if exist "%ISCC%" (
            "%ISCC%" /DMyAppVersion=%VOXD_VERSION% installers\windows\voxd.iss
          ) else (
            where iscc
            iscc /DMyAppVersion=%VOXD_VERSION% installers\windows\voxd.iss
          )

      - name: Code sign installer (optional)
        if: ${{ vars.ENABLE_CODE_SIGNING == 'true' }}
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:TEMP "voxd_cert.pfx"
          [System.Convert]::FromBase64String($env:CERT_PFX_BASE64) | Set-Content -Path $pfx -AsByteStream
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1
          $setup = Get-ChildItem "build\windows\*-Setup.exe"
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $setup.FullName

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\VOXD -DestinationPath "build\windows\VOXD-${{ steps.version.outputs.VERSION }}-portable.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxd-windows
          path: |
            build/windows/*-Setup.exe
            build/windows/*-portable.zip
