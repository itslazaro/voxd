name: Publish Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Attach builds to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for and collect build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in build-windows.yml build-linux.yml; do
            echo "Waiting for $wf..."
            run_id=""
            for _ in $(seq 1 60); do
              run_id=$(gh run list --workflow "$wf" --commit "$GITHUB_SHA" \
                --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
              conclusion=$(gh run list --workflow "$wf" --commit "$GITHUB_SHA" \
                --limit 1 --json conclusion --jq '.[0].conclusion // "pending"' 2>/dev/null || echo pending)
              if [ "$conclusion" = "success" ]; then
                break
              fi
              if [ "$conclusion" = "failure" ]; then
                echo "::error::$wf failed; not publishing a release."
                exit 1
              fi
              sleep 20
            done
            if [ "$conclusion" != "success" ]; then
              echo "::error::Timed out waiting for $wf."
              exit 1
            fi
            echo "Downloading artifacts from run $run_id ($wf)"
            gh run download "$run_id" -D dist
          done

      - name: Remove stale release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$GITHUB_REF_NAME" --yes || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: true
