[project]
name = "voxd"
version = "1.0.1"
description = "Local-first AI voice dictation. Whisper transcription injected into any application."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VOXD contributors" }]
keywords = ["dictation", "voice", "whisper", "speech-to-text", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "PySide6>=6.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
linux = [
    "pynput>=1.7.6",
]
windows = [
    "pynput>=1.7.6",
    "pyautogui>=0.9.54",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "build>=1.0",
    "setuptools>=68",
    "wheel>=0.42",
    "pyinstaller>=6.6",
]

[project.scripts]
voxd = "app.main:main"
voxd-setup = "scripts.setup_whisper:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.core", "app.services", "app.gui"]
include-package-data = true

[tool.setuptools.package-data]
app = ["../assets/icons/*.png", "../assets/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
